name: Build GigaAM CUDA 12.6

on:
  push:
    branches: [main]
    paths:
      - "gigaam/**"
      - ".github/workflows/docker-cuda126.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the torch wheels
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish CUDA 12.6
        uses: docker/build-push-action@v6
        with:
          context: ./gigaam
          file: ./gigaam/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            TORCH_VERSION=2.10.0
            TORCH_INDEX=https://download.pytorch.org/whl/cu126
          tags: |
            ${{ steps.image.outputs.name }}:latest-cuda126
            ${{ steps.image.outputs.name }}:2.10.0-cuda126
