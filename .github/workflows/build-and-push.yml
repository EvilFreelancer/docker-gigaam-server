# Builds and pushes evilfreelancer/gigaam-server for NVIDIA (-cuda) and Intel (-xpu).
# A tag vX.Y.Z publishes X.Y.Z-<variant> and latest-<variant>; a manual run publishes
# latest-<variant> from the chosen ref. Needs the repository secrets DOCKERHUB_USERNAME
# and DOCKERHUB_TOKEN.
name: Build and push images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda
            dockerfile: gigaam/Dockerfile
          - variant: xpu
            dockerfile: gigaam/Dockerfile.xpu
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the torch wheels
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          image=evilfreelancer/gigaam-server
          tags="${image}:latest-${{ matrix.variant }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tags="${tags},${image}:${GITHUB_REF_NAME#v}-${{ matrix.variant }}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./gigaam
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
